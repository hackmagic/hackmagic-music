<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HackMagic Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Self-drawn Title Bar (content filled by JS) -->
  <div id="title-bar" class="electron-drag-region"></div>

  <!-- Menu Bar -->
  <div id="menu-bar"></div>

  <div id="app">
    <!-- Sidebar Tabs -->
    <aside id="sidebar">
      <div id="sidebar-tabs">
        <button class="tab-btn active" data-tab="playlist">&#x1F3B5; Playlist</button>
        <button class="tab-btn" data-tab="media">&#x1F4C1; Library</button>
        <button class="tab-btn" data-tab="settings">&#x2699; Settings</button>
      </div>
      <div id="sidebar-content">
        <!-- Playlist Tab -->
        <div class="tab-content active" id="tab-playlist">
          <div id="sidebar-header">
            <h2 id="pl-name">Playlist</h2>
            <div id="sidebar-header-right">
              <span id="track-count">0</span>
              <button id="pl-sort-btn" class="small-btn" title="排序">⇕</button>
              <button id="pl-filter-btn" class="small-btn" title="过滤">⊡</button>
            </div>
          </div>
          <div id="pl-search-box">
            <input type="text" id="pl-search" placeholder="搜索播放列表..." />
          </div>
          <div id="playlist"></div>
        </div>
        <!-- Media Library Tab -->
        <div class="tab-content" id="tab-media">
          <div id="media-header">
            <h2>Media Library</h2>
            <button id="media-back-btn" class="small-btn" style="display:none">&#x2190; Back</button>
          </div>
          <div id="media-categories"></div>
          <div id="media-search-box">
            <input type="text" id="media-search" placeholder="搜索曲目..." />
          </div>
          <div id="media-content"></div>
        </div>
        <!-- Settings Tab -->
        <div class="tab-content" id="tab-settings">
          <div id="settings-header">
            <h2>Settings</h2>
          </div>
          <div id="settings-content"></div>
        </div>
      </div>
    </aside>

    <!-- Main content -->
    <main id="main">
      <!-- Sidebar drawer toggle (narrow/small mode, rendered by JS) -->
      <button id="sidebar-toggle" class="ctrl-btn fn-btn" title="显示侧栏" style="display:none"></button>

      <!-- Now playing -->
      <section id="now-playing">
        <div id="album-art">
          <img id="cover-img" style="display:none" alt="Album Cover" />
          <svg id="cover-placeholder" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="none" stroke="var(--accent)" stroke-width="2" opacity="0.3"/>
            <circle cx="50" cy="50" r="18" fill="var(--accent)" opacity="0.6"/>
            <circle cx="50" cy="50" r="6" fill="var(--bg)"/>
          </svg>
        </div>
        <div id="track-info">
          <div id="track-title">No track</div>
          <div id="track-artist">&mdash;</div>
          <div id="track-album">&mdash;</div>
        </div>
        <div id="repeat-indicator" class="badge" title="循环模式">&#x1F501; list</div>
      </section>

      <!-- Lyrics -->
      <section id="lyric-section">
        <div id="lyric-header">
          <span>Lyrics</span>
          <button id="btn-dl-lyric" title="Search online lyrics">&#x21E9; DL</button>
        </div>
        <div id="lyric-container">
          <div id="lyric-lines"></div>
          <div id="lyric-placeholder">&#x266B; No lyrics</div>
        </div>
      </section>

      <!-- Progress -->
      <section id="progress-section">
        <div id="progress-bar">
          <div id="progress-fill"></div>
          <div id="progress-thumb"></div>
        </div>
        <div id="time-display">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </section>

      <!-- Controls rendered by JS -->
      <section id="controls-primary" class="ctrl-row"></section>
      <section id="controls-secondary" class="ctrl-row"></section>

      <!-- Volume + Spectrum row (grouped) -->
      <div id="bottom-bar">
        <!-- Volume -->
        <section id="volume-section">
          <span id="vol-icon-wrap"></span>
          <input type="range" id="vol-slider" min="0" max="100" value="80">
          <span id="vol-label">80</span>
        </section>

        <!-- Connection status inline -->
        <div id="connection-status" class="disconnected">
          <span id="conn-dot"></span>
          <span id="conn-text">正在连接后端...</span>
        </div>
      </div>

      <!-- Spectrum -->
      <section id="spectrum-section">
        <canvas id="spectrum" width="640" height="80"></canvas>
      </section>
    </main>
  </div>
  <script src="icons.js"></script>
  <script src="menu.js"></script>
  <script src="ohos-adapter.js"></script>
  <script src="app.js"></script>
</body>
</html>
