<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mini Player</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:transparent;
  font-family:-apple-system,"Segoe UI",sans-serif;
  color:var(--l-text,#eee);
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
}
/* ===== Layout modes ===== */
body.layout-cover #top-row{flex-direction:column;align-items:center;gap:6px}
body.layout-cover #cover-wrap{width:80px;height:80px}
body.layout-cover #cover-wrap img{width:100%;height:100%;object-fit:cover}
body.layout-cover #cover-wrap svg{width:40px;height:40px;opacity:0.3}
body.layout-cover #track-info{text-align:center;width:100%}
body.layout-cover #track-title{font-size:14px}
body.layout-cover #track-artist{font-size:12px}
body.layout-cover #controls{gap:20px;margin-top:2px}
body.layout-cover #btn-prev svg{width:18px;height:18px}
body.layout-cover #btn-next svg{width:18px;height:18px}
body.layout-cover .primary{width:40px;height:40px}

body.layout-lyrics #cover-wrap{width:40px;height:40px}
body.layout-lyrics #cover-wrap img{width:100%;height:100%;object-fit:cover}
body.layout-lyrics #cover-wrap svg{width:24px;height:24px;opacity:0.3}
body.layout-lyrics #track-title{font-size:13px}
body.layout-lyrics #track-artist{font-size:11px}
body.layout-lyrics #lyric-wrap{min-height:4em}
body.layout-lyrics .lyric-line-k{font-size:calc(var(--l-size,14px) + 2px)}
body.layout-lyrics #controls{gap:12px}
body.layout-lyrics #close-btn{display:none}

body.layout-compact #cover-wrap{width:44px;height:44px}
body.layout-compact #cover-wrap img{width:100%;height:100%;object-fit:cover}
body.layout-compact #cover-wrap svg{width:28px;height:28px;opacity:0.3}
body.layout-compact #track-title{font-size:12px}
body.layout-compact #track-artist{font-size:11px}
body.layout-compact #controls{gap:10px}
body.layout-compact .primary{width:36px;height:36px}
body.layout-compact #btn-prev svg{width:14px;height:14px}
body.layout-compact #btn-next svg{width:14px;height:14px}
body.layout-compact #progress{height:2px}
body.layout-compact #close-btn{font-size:14px}

#panel{
  background:rgba(20,20,40,0.55);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px;
  margin:8px;
  padding:14px 16px;
  display:flex;
  flex-direction:column;
  gap:8px;
  box-shadow:0 8px 40px rgba(0,0,0,0.5);
}
#top-row{
  display:flex;
  align-items:center;
  gap:12px;
}
#cover-wrap{
  width:56px;height:56px;
  flex-shrink:0;
  border-radius:8px;
  overflow:hidden;
  background:rgba(255,255,255,0.06);
  display:flex;
  align-items:center;
  justify-content:center;
}
#cover-wrap img{width:100%;height:100%;object-fit:cover;display:none}
#cover-wrap svg{width:32px;height:32px;opacity:0.3}
#track-info{
  flex:1;
  min-width:0;
  cursor:grab;
}
#track-info:active{cursor:grabbing}
#track-title{
  font-size:14px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:#fff;
}
#track-artist{
  font-size:12px;color:rgba(255,255,255,0.55);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#close-btn{
  background:none;border:none;
  color:rgba(255,255,255,0.3);cursor:pointer;
  font-size:18px;padding:2px 6px;border-radius:4px;
  align-self:flex-start;line-height:1;
}
#close-btn:hover{color:#e94560;background:rgba(233,69,96,0.12)}
#lyric-wrap{
  position:relative;
  text-align:var(--l-align,center);
  min-height:3em;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:2px;
  padding:2px 0;
}
.lyric-line-k{
  position:relative;
  font-size:var(--l-size,14px);
  line-height:var(--l-height,1.5);
  white-space:nowrap;
  overflow:hidden;
  padding:1px 0;
  transition:color .2s;
}
/* Tri-color gradient karaoke support */
.lyric-line-k .k-bg{
  position:absolute;
  left:0;top:0;
  width:100%;height:100%;
  white-space:nowrap;
  overflow:hidden;
  transition:width .08s linear;
  z-index:1;
  /* Default dual-color gradient (overridden by JS for tri-color) */
  background:linear-gradient(90deg,var(--l-color1,#e94560),var(--l-color1,#e94560));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.lyric-line-k .k-text{
  display:inline-block;
  white-space:nowrap;
  position:relative;
  z-index:0;
  color:var(--l-color2,rgba(255,255,255,0.35));
}
.lyric-line-k.translation{
  font-size:calc(var(--l-size,14px) - 2px);
  opacity:0.7;
}
/* Marquee for long text */
.lyric-line-k .k-text.marquee{
  animation:marquee 8s linear infinite;
  padding-left:0;
}
.lyric-line-k .k-bg.marquee{
  animation:marquee-bg 8s linear infinite;
}
@keyframes marquee{
  0%{transform:translateX(0)}
  10%{transform:translateX(0)}
  80%{transform:translateX(calc(-100% + 300px))}
  90%{transform:translateX(calc(-100% + 300px))}
  100%{transform:translateX(0)}
}
@keyframes marquee-bg{
  0%{transform:translateX(0)}
  10%{transform:translateX(0)}
  80%{transform:translateX(calc(-100% + 300px))}
  90%{transform:translateX(calc(-100% + 300px))}
  100%{transform:translateX(0)}
}
/* Layout switcher button */
#layout-btn{
  background:none;border:none;
  color:rgba(255,255,255,0.2);cursor:pointer;
  font-size:10px;padding:1px 4px;border-radius:3px;
  align-self:flex-start;line-height:1;
  margin-top:1px;
}
#layout-btn:hover{color:rgba(255,255,255,0.6);background:rgba(255,255,255,0.06)}
#controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:16px;
}
#controls button{
  background:none;border:none;
  color:rgba(255,255,255,0.75);
  cursor:pointer;
  font-size:16px;
  width:36px;height:36px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
#controls button:hover{
  background:rgba(255,255,255,0.1);
  color:#fff;
}
#controls .primary{
  width:44px;height:44px;
  background:rgba(233,69,96,0.2);
  color:#e94560;font-size:18px;
}
#controls .primary:hover{
  background:rgba(233,69,96,0.35);
}
#progress{
  height:3px;
  background:rgba(255,255,255,0.1);
  border-radius:2px;
  overflow:hidden;
}
#progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#e94560,#ff6b6b);
  border-radius:2px;
  transition:width .3s;
}
#placeholder{
  text-align:center;
  color:rgba(255,255,255,0.25);
  font-size:12px;
  padding:20px 0;
}
.hidden{display:none!important}
svg{fill:currentColor}
#conn-status{
  text-align:center;
  font-size:11px;
  padding:4px 0;
  display:none;
}
#conn-status.visible{
  display:block;
}
#conn-status.connected #conn-text-m{color:#2ecc71}
#conn-status.disconnected #conn-text-m{color:#f39c12;animation:conn-pulse-m 1.5s ease-in-out infinite}
#conn-dot-m{
  display:inline-block;
  width:5px;height:5px;
  border-radius:50%;
  margin-right:4px;
  vertical-align:middle;
}
#conn-status.connected #conn-dot-m{background:#2ecc71}
#conn-status.disconnected #conn-dot-m{background:#f39c12;animation:conn-pulse-m 1.5s ease-in-out infinite}
@keyframes conn-pulse-m{
  0%,100%{opacity:1}
  50%{opacity:0.3}
}
</style>
</head>
<body>
<div id="panel">
  <div id="top-row" class="electron-drag-region">
    <div id="cover-wrap">
      <img id="cover-img" alt="">
      <svg id="cover-ph" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="2" opacity="0.3"/><circle cx="50" cy="50" r="18" fill="currentColor" opacity="0.6"/><circle cx="50" cy="50" r="6" fill="rgba(20,20,40,0.55)"/></svg>
    </div>
    <div id="track-info" class="electron-drag-region">
      <div id="track-title">-</div>
      <div id="track-artist">-</div>
    </div>
    <button id="layout-btn" title="切换布局">⊞</button>
    <button id="close-btn">&times;</button>
  </div>
  <div id="lyric-wrap">
    <div id="lyric-primary" class="lyric-line-k"><span class="k-text">&#9835; 等待播放...</span><span class="k-bg"></span></div>
    <div id="lyric-secondary" class="lyric-line-k translation hidden"><span class="k-text"></span><span class="k-bg"></span></div>
  </div>
  <div id="controls">
    <button id="btn-prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
    <button id="btn-play" class="primary" title="Play/Pause">
      <svg viewBox="0 0 24 24" id="play-icon"><path d="M8 5v14l11-7z"/></svg>
      <svg viewBox="0 0 24 24" id="pause-icon" class="hidden"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
    </button>
    <button id="btn-next" title="Next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
  </div>
  <div id="progress"><div id="progress-fill"></div></div>
</div>
<div id="placeholder">启动播放器后自动连接...</div>
<div id="conn-status" class="disconnected">
  <span id="conn-dot-m"></span>
  <span id="conn-text-m">正在连接后端...</span>
</div>
<script>
const API='http://127.0.0.1:10280';
const WS_URL='ws://127.0.0.1:10280/ws';
let state={playing:false,paused:false,position:0,duration:0,title:'-',artist:'-',connected:false};

// Layout modes
const LAYOUTS=['compact','cover','lyrics'];
let layoutIdx=0;
function cycleLayout(){
  layoutIdx=(layoutIdx+1)%LAYOUTS.length;
  const name=LAYOUTS[layoutIdx];
  document.body.className='layout-'+name;
  localStorage.setItem('mp_mini_layout',name);
}
function loadLayout(){
  const saved=localStorage.getItem('mp_mini_layout')||'compact';
  layoutIdx=LAYOUTS.indexOf(saved);
  if(layoutIdx<0)layoutIdx=0;
  document.body.className='layout-'+LAYOUTS[layoutIdx];
}

// Tri-color gradient support (overrides dual-color)
const TRICOLOR_SCHEMES={
  sunset:{c1:'#e94560',c2:'#ff6b6b',c3:'#feca57'},
  ocean:{c1:'#4fc3f7',c2:'#1de9b6',c3:'#7c4dff'},
  forest:{c1:'#66bb6a',c2:'#aed581',c3:'#4dd0e1'},
  fire:{c1:'#ff7043',c2:'#ff8a65',c3:'#ffd54f'},
  neon:{c1:'#bb86fc',c2:'#03dac6',c3:'#cf6679'},
};
const LYRIC_COLORS={
  default:{color1:'#e94560',color2:'rgba(255,255,255,0.35)'},
  blue:{color1:'#4fc3f7',color2:'rgba(255,255,255,0.35)'},
  green:{color1:'#66bb6a',color2:'rgba(255,255,255,0.35)'},
  purple:{color1:'#bb86fc',color2:'rgba(255,255,255,0.35)'},
  orange:{color1:'#ff7043',color2:'rgba(255,255,255,0.35)'},
};
function loadLyricSettings(){
  const scheme=localStorage.getItem('mp_lyric_color')||'default';
  const colors=LYRIC_COLORS[scheme]||LYRIC_COLORS.default;
  document.documentElement.style.setProperty('--l-color1',colors.color1);
  document.documentElement.style.setProperty('--l-color2',colors.color2);
  // Apply tri-color gradient if active
  const triScheme=localStorage.getItem('mp_lyric_tricolor');
  if(triScheme&&TRICOLOR_SCHEMES[triScheme]){
    const tc=TRICOLOR_SCHEMES[triScheme];
    document.querySelectorAll('.k-bg').forEach(el=>{
      el.style.background=`linear-gradient(90deg,${tc.c1},${tc.c2},${tc.c3})`;
      el.style.webkitBackgroundClip='text';
      el.style.backgroundClip='text';
      el.style.color='transparent';
    });
  }else{
    document.querySelectorAll('.k-bg').forEach(el=>{
      el.style.background=`linear-gradient(90deg,${colors.color1},${colors.color1})`;
      el.style.webkitBackgroundClip='text';
      el.style.backgroundClip='text';
      el.style.color='transparent';
    });
  }
  const opacity=localStorage.getItem('mp_lyric_opacity')||'0.55';
  document.getElementById('panel').style.background=`rgba(20,20,40,${opacity})`;
  const align=localStorage.getItem('mp_lyric_align')||'center';
  document.documentElement.style.setProperty('--l-align',align);
  const size=localStorage.getItem('mp_lyric_size')||'14';
  document.documentElement.style.setProperty('--l-size',size+'px');
  const height=localStorage.getItem('mp_lyric_height')||'1.5';
  document.documentElement.style.setProperty('--l-height',height);
}

let connRetryDelayM=500;
const CONN_MAX_RETRY_M=30000;

function updateConnStatusM(){
  const el=document.getElementById('conn-status');
  const text=document.getElementById('conn-text-m');
  if(state.connected){
    el.className='visible connected';
    text.textContent='已连接';
  }else{
    el.className='visible disconnected';
    text.textContent=connRetryDelayM<CONN_MAX_RETRY_M?'正在连接后端...':'后端连接失败';
  }
}

async function checkBackendM(){
  try{
    const res=await fetch(API+'/api/health',{method:'GET',signal:AbortSignal.timeout(3000)});
    if(res.ok){
      const data=await res.json();
      if(data.ok){
        if(!state.connected){
          state.connected=true;
          connRetryDelayM=500;
          updateConnStatusM();
          document.getElementById('placeholder').classList.add('hidden');
          document.getElementById('panel').classList.remove('hidden');
          pollM();
        }
        return true;
      }
    }
  }catch(_){}
  if(state.connected){
    state.connected=false;
    updateConnStatusM();
    document.getElementById('panel').classList.add('hidden');
    document.getElementById('placeholder').classList.remove('hidden');
  }
  connRetryDelayM=Math.min(connRetryDelayM*1.5,CONN_MAX_RETRY_M);
  setTimeout(checkBackendM,connRetryDelayM);
  return false;
}

async function api(m,p,b){
  try{
    const o={method:m,headers:{}};
    if(b){o.headers['Content-Type']='application/json';o.body=JSON.stringify(b)}
    const r=await fetch(API+p,o);
    if(!r.ok)return null;
    return await r.json()
  }catch(e){return null}
}
async function cmd(c){return api('POST','/api/command',{command:c})}

async function pollStatus(){
  const d=await api('GET','/api/status');
  if(!d)return;
  state.playing=d.state==='playing';
  state.paused=d.state==='paused';
  state.position=d.track?.position_secs||0;
  state.duration=d.track?.duration_secs||0;
  state.title=d.track?.title||'暂无曲目';
  state.artist=d.track?.artist||'';
  document.getElementById('track-title').textContent=state.title;
  document.getElementById('track-artist').textContent=state.artist||'\u2014';
  const pi=document.getElementById('play-icon');
  const pa=document.getElementById('pause-icon');
  pi.classList.toggle('hidden',state.playing);
  pa.classList.toggle('hidden',!state.playing);
  const pct=state.duration>0?(state.position/state.duration)*100:0;
  document.getElementById('progress-fill').style.width=Math.min(pct,100)+'%';
}

let lastLyricJson='';

function calcKaraokePct(lines,posMs){
  const curIdx=lines.findIndex(l=>l.is_current);
  if(curIdx<0||curIdx>=lines.length)return 0;
  const cur=lines[curIdx];
  const next=lines[curIdx+1];
  if(!next)return 1;
  const dur=next.time_ms-cur.time_ms;
  if(dur<=0)return 1;
  const elapsed=posMs-cur.time_ms;
  return Math.max(0,Math.min(1,elapsed/dur));
}

async function pollLyric(){
  const d=await api('GET','/api/lyric');
  if(!d||!d.has_lyrics||d.lines.length===0){
    const el=document.getElementById('lyric-primary');
    if(el)el.querySelector('.k-text').textContent='\u266B 暂无歌词';
    return
  }
  const json=JSON.stringify(d);
  const cur=d.lines.find(l=>l.is_current);
  if(!cur){
    document.getElementById('lyric-primary').querySelector('.k-text').textContent='\u266B 准备中...';
    return
  }
  // Calculate karaoke progress
  const pct=calcKaraokePct(d.lines,d.position_ms);

  // Primary line with karaoke
  const prim=document.getElementById('lyric-primary');
  const primText=prim.querySelector('.k-text');
  const primBg=prim.querySelector('.k-bg');
  if(primText.textContent!==cur.text||json!==lastLyricJson){
    primText.textContent=cur.text;
    primBg.textContent=cur.text;
    lastLyricJson=json;
  }
  primBg.style.width=(pct*100)+'%';

  // Secondary translation line
  const sec=document.getElementById('lyric-secondary');
  if(cur.translate){
    sec.classList.remove('hidden');
    const secText=sec.querySelector('.k-text');
    const secBg=sec.querySelector('.k-bg');
    if(secText.textContent!==cur.translate){
      secText.textContent=cur.translate;
      secBg.textContent=cur.translate;
    }
    secBg.style.width=(pct*100)+'%';
  }else{
    sec.classList.add('hidden');
  }
}

let pollCountM=0;
let pollTimerM=null;
async function pollM(){
  if(!state.connected)return;
  await pollStatus();
  pollLyric(); // every cycle for smooth karaoke
  pollCountM++;
  if(pollCountM%6===0){ // less frequent cover fetch
    // fetch cover (not critical for karaoke)
  }
  pollTimerM=setTimeout(pollM,80); // ~12fps for smooth karaoke animation
}
// Passthrough toggle
async function setPassthrough(enabled){
  if(window.__TAURI__&&window.__TAURI__.core){
    try{await window.__TAURI__.core.invoke('toggle_overlay_passthrough',{enabled})}
    catch(e){}
  }
}
const panel=document.getElementById('panel');
panel.addEventListener('mouseenter',()=>setPassthrough(false));
panel.addEventListener('mouseleave',()=>setPassthrough(true));
// Enable passthrough on initial load (after a short delay for window setup)
setTimeout(()=>setPassthrough(true),500);

document.getElementById('btn-play').addEventListener('click',()=>cmd('pause'));
document.getElementById('btn-next').addEventListener('click',()=>cmd('next'));
document.getElementById('btn-prev').addEventListener('click',()=>cmd('prev'));
document.getElementById('layout-btn').addEventListener('click',cycleLayout);
document.getElementById('close-btn').addEventListener('click',async()=>{
  if(window.__TAURI__&&window.__TAURI__.window){
    try{const w=window.__TAURI__.window.getCurrent();await w.close()}catch(e){}
    window.close()
  }else window.close()
});
loadLyricSettings();
loadLayout();
updateConnStatusM();
checkBackendM();
</script>
</body>
</html>
