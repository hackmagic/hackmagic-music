[package]
name = "hm"
version = "1.0.0"
edition = "2021"
description = "HackMagic Music Player - Cross-platform music player with native GPUI"

[[bin]]
name = "hm"
path = "src/main.rs"

[[bin]]
name = "hm-gui"
path = "src/bin/gui.rs"

[[bin]]
name = "hm-e2e-test"
path = "src/bin/hm-e2e-test.rs"

[[bin]]
name = "hm-screenshot"
path = "src/bin/hm-screenshot.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Async runtime (for daemon mode, HTTP in future)
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
toml = "0.8"

# Audio metadata (replaces TagLib)
lofty = "0.22"

# LRU cache for album art
lru = "0.13"

# Lock-free snapshot publishing (player state for GUI)
arc-swap = "1"

# Memory-mapped file I/O for zero-copy audio loading
memmap2 = "0.9"

# HTTP client (for lyrics download / Last.fm)
reqwest = { version = "0.12", features = ["json"] }

# Async trait support (for MusicSource trait)
async-trait = "0.1"

# HTTP server (for daemon IPC) + WebSocket + static files
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
futures-util = "0.3"

# Dynamic library loading (for BASS)
libloading = "0.8"

# Cross-platform audio output (for FFmpeg engine)
cpal = "0.15"

# Pure Rust audio playback (for Rodio engine)
rodio = { version = "0.19", features = ["mp3", "flac", "vorbis"] }

# Pure Rust audio decoding (for Symphonia engine — broader codec support)
symphonia = { version = "0.5", default-features = false, features = ["all-codecs", "all-formats", "pcm"] }

# Embedding: use third-party OpenAI-compatible API (no local inference)

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"

# Time
chrono = "0.4"

# Random
rand = "0.8"

# Regex for filename parsing
regex = "1"

# Ctrl+C signal handling
ctrlc = "3"

# Character encoding detection (GBK/Shift-JIS for LRC/tags)
encoding_rs = "0.8"

# MD5 hashing (for Last.fm API signing)
md-5 = "0.10"

# Base64 decoding (for QQ Music lyrics)
base64 = "0.22"

# Native GUI
rfd = "0.15"
async-channel = "2"
gpui = "0.2.2"
gpui-component = "0.5.1"


# Windows SMTC integration
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Media",
    "Foundation",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
embed-resource = "3"

[profile.release]
# 体积优先的发布档（交付用）。逐项作用：
#   opt-level = "s"    —— 在代码体积与速度间取平衡（"z" 更小但明显拖慢解码/DSP）
#   lto = "fat"        —— 跨 crate 内联 + 死代码消除，去掉大量未引用的框架代码
#   codegen-units = 1  —— 让优化器看到全量代码，避免分割后重复实例化泛型
#   panic = "abort"    —— 去掉 unwind 表与 landing pad（本项目无 catch_unwind 依赖）
#   strip = true       —— 剥离符号表
#   incremental = false—— 关闭增量编译，避免为增量元数据保留额外产物
# 代价：release 构建明显变慢；日常迭代请用 debug（cargo build / cargo run）。
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
